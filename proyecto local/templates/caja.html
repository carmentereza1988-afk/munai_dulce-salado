<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munai - Panel de Caja y Cocina</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .grid-pedidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .tarjeta-pedido {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 6px solid #e74c3c;
        }
        .tarjeta-pedido.preparando { border-left-color: #f39c12; }
        .tarjeta-pedido.listo { border-left-color: #2ecc71; }
        .header-pedido {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .detalles { margin-bottom: 15px; }
        .botones { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-preparar { background-color: #f39c12; }
        .btn-listo { background-color: #2ecc71; }
    </style>
</head>
<body>

    <h1>🛒 Panel de Comandas - Munai Dulce & Salado</h1>
    
    <div id="grid-pedidos" class="grid-pedidos">
        <p id="mensaje-vacio">Esperando pedidos nuevos...</p>
    </div>

    <script>
        const socket = io({
        transports: ['websocket', 'polling']
    });

    // 🚀 CONSULTA AUTOMÁTICA CADA 2 SEGUNDOS
    setInterval(() => {
        socket.emit('obtener_pedidos');
    }, 2000);
      
        // Al conectar, pedir pedidos previos
        socket.on('connect', () => {
            console.log("Conectado al servidor de WebSocket");
            socket.emit('obtener_pedidos');
        });

        // Función para renderizar un pedido en pantalla
        function renderizarTarjeta(data) {
            const contenedor = document.getElementById('grid-pedidos');
            const mensajeVacio = document.getElementById('mensaje-vacio');
            if (mensajeVacio) mensajeVacio.remove();

            // Si la tarjeta ya existe en la pantalla, la actualizamos
            let tarjetaExistente = document.getElementById(`pedido-${data.id}`);
            if (tarjetaExistente) {
                tarjetaExistente.querySelector('.estado').innerText = data.estado;
                tarjetaExistente.className = `tarjeta-pedido ${(data.estado || 'pendiente').toLowerCase().replace(' ', '-')}`;
                return;
            }

            // Crear nueva tarjeta
            const tarjeta = document.createElement('div');
            tarjeta.className = `tarjeta-pedido ${(data.estado || 'pendiente').toLowerCase().replace(' ', '-')}`;
            tarjeta.id = `pedido-${data.id}`;

            let listaProd = '';
            if (Array.isArray(data.productos)) {
                listaProd = data.productos.map(p => typeof p === 'object' ? `${p.nombre || 'Producto'}` : p).join(', ');
            } else {
                listaProd = data.productos || 'Detalles del pedido';
            }

            tarjeta.innerHTML = `
                <div class="header-pedido">
                    <span class="id-pedido">Pedido #${data.id}</span>
                    <span class="estado">${data.estado || 'Pendiente'}</span>
                </div>
                <div class="detalles">
                    <p><strong>Cliente:</strong> ${data.cliente || data.nombre || 'Cliente'}</p>
                    <p><strong>Mesa/Lugar:</strong> ${data.mesa || 'N/A'}</p>
                    <p><strong>Productos:</strong> ${listaProd}</p>
                    <p><strong>Total:</strong> $${parseFloat(data.total || 0).toFixed(2)}</p>
                </div>
                <div class="botones">
                    <button class="btn-preparar" onclick="cambiarEstado(${data.id}, 'Preparando')">En Preparación</button>
                    <button class="btn-listo" onclick="cambiarEstado(${data.id}, 'Listo')">Listo</button>
                </div>
            `;
            contenedor.prepend(tarjeta);
        }

        // Escuchar pedido individual en tiempo real
        socket.on('recibir_pedido', function(pedido) {
            renderizarTarjeta(pedido);
        });

        // Escuchar lista completa de sincronización
        socket.on('actualizar_lista', function(pedidos) {
            const contenedor = document.getElementById('grid-pedidos');
            if (!pedidos || pedidos.length === 0) {
                contenedor.innerHTML = '<p id="mensaje-vacio">Esperando pedidos nuevos...</p>';
                return;
            }
            pedidos.forEach(p => renderizarTarjeta(p));
        });

        function cambiarEstado(id, nuevoEstado) {
            socket.emit('cambiar_estado', { id: id, estado: nuevoEstado });
        }
    </script>
</body>
</html>
